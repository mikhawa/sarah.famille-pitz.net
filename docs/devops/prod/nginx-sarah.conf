# nginx — site de Sarah en production, AlmaLinux 9 (/etc/nginx/conf.d/sarah.famille-pitz.net.conf)
# Certificat Let's Encrypt obtenu avec : certbot --nginx -d sarah.famille-pitz.net

server {
    listen 80;
    listen [::]:80;
    server_name sarah.famille-pitz.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Syntaxe compatible avec nginx 1.20 / 1.24 d'AlmaLinux 9 (« http2 on; » n'existe qu'à partir de 1.25.1)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sarah.famille-pitz.net;

    ssl_certificate     /etc/letsencrypt/live/sarah.famille-pitz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sarah.famille-pitz.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/sarah/public;
    server_tokens off;

    # Envoi de plusieurs photos et vidéos à la fois (aligné sur post_max_size de PHP)
    client_max_body_size 1G;

    # En-têtes de sécurité. Attention : une location qui déclare ses propres add_header n'hérite pas de ceux-ci.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets compilés par asset-map:compile : noms versionnés, cache long
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Médias privés : nginx les envoie seulement après le contrôle des droits par Symfony (X-Accel-Redirect).
    # « internal » : inaccessible directement depuis le navigateur. Doit correspondre à MEDIA_X_ACCEL_PREFIX.
    location ^~ /_media_internal/ {
        internal;
        alias /var/www/sarah/var/storage/media/;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm/sarah.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        internal;
    }

    # Aucun autre fichier PHP exécutable, aucun fichier caché (.env, .git…)
    location ~ \.php$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    error_log /var/log/nginx/sarah_error.log;
    access_log /var/log/nginx/sarah_access.log;
}
