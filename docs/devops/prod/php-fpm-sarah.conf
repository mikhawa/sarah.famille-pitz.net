; PHP-FPM — pool dédié au site de Sarah (/etc/php/8.3/fpm/pool.d/sarah.conf)
; Le site tourne sous son propre utilisateur, jamais sous www-data.

[sarah]
user = sarah
group = sarah

listen = /run/php/php8.3-fpm-sarah.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Envoi de photos et vidéos (identique à docker/php/php.ini)
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 1G
php_admin_value[max_file_uploads] = 50
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[date.timezone] = Europe/Brussels
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off

; Le code ne change qu'au déploiement : pas de vérification des fichiers, PHP-FPM est rechargé après chaque mise à jour
php_admin_flag[opcache.validate_timestamps] = off
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600

catch_workers_output = yes
