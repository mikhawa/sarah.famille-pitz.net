name: sarah

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: sarah_php
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: "mysql://sarah_user:sarah_pass@db:3306/sarah_db?serverVersion=11.4.10-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"

  nginx:
    image: nginx:alpine
    container_name: sarah_nginx
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11.4
    container_name: sarah_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sarah_db
      MYSQL_USER: sarah_user
      MYSQL_PASSWORD: sarah_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sarah_phpmyadmin
    ports:
      - "8181:80"
    environment:
      PMA_HOST: db
      PMA_USER: sarah_user
      PMA_PASSWORD: sarah_pass
      UPLOAD_LIMIT: 256M
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: sarah_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
