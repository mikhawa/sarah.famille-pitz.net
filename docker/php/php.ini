; Configuration PHP pour l'environnement de développement

memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 1G
max_file_uploads = 50
max_execution_time = 300
max_input_time = 300
date.timezone = Europe/Brussels

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
