# Préprod : tests à chaque push et pull request (relançables à la main depuis l'onglet Actions).
# Aucun déploiement depuis GitHub : la mise en ligne se fait à la main sur le VPS, avec git (branche main) :
# voir docs/devops/cyberpanel.md, section 6.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (préprod)
    runs-on: ubuntu-24.04
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: test
      # Doctrine ajoute le suffixe _test : base sarah_db_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sarah_db?serverVersion=11.4.10-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg (nettoyage des vidéos, testé par la suite)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip, gd, exif
          ini-values: date.timezone=Europe/Brussels, memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vérifications statiques
        run: |
          composer validate --strict --no-check-publish
          php bin/console lint:yaml config/ --parse-tags
          php bin/console lint:twig templates/
          php bin/console lint:container

      - name: Base de test
        run: |
          php bin/console doctrine:database:create --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: Tests PHPUnit
        run: php bin/phpunit --no-coverage
